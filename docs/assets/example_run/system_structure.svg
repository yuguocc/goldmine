  <g fill="#000" font-family="Times New Roman, Times, serif" font-size="28" text-anchor="middle">
    <text x="318.5" y="99">Factor generation</text>
    <text x="311" y="267">Scheduler</text>
    <text x="318.5" y="389" font-size="32">novelty/mutation</text>
    <text x="173.5" y="462">Candidate 1</text>
    <text x="451" y="462">Candidate 2</text>
    <text x="307" y="531" font-size="32" letter-spacing="3">.........</text>
    <text x="173.5" y="607">Candidate n-1</text>
    <text x="451" y="607">Candidate n</text>
    <text x="660" y="491">Signals</text>
    <text x="803.5" y="446">Step 1</text>
    <text x="803.5" y="512">IC</text>
    <text x="803.5" y="545">screening</text>
    <text x="803.5" y="611">IC &gt; 0.01</text>
    <text x="1008" y="447">Step 2</text>
    <text x="1008" y="513">Correlation</text>
    <text x="1008" y="546">check</text>
    <text x="1008" y="612">correlation&lt;0.95</text>
    <text x="1259.5" y="448">Step 3</text>
    <text x="1259.5" y="514">Marginal</text>
    <text x="1259.5" y="547">contribution check</text>
    <text x="1259.5" y="613">d&gt;0</text>
    <text x="419" y="726">Economic</text>
    <text x="419" y="759">hypothesis</text>
    <text x="305" y="851">Economic Reflection</text>
    <text x="1049" y="743">Factor library</text>
    <text x="1052" y="856">Successful directions, Forbidden directions</text>
  </g>
</svg>
