<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1449" height="929" viewBox="0 0 1449 929">
  <title>Factor generation system structure</title>
  <desc>Candidate factors pass IC screening, correlation and marginal contribution checks into a factor library. Economic reflection records successful and forbidden directions, feeding back into factor generation.</desc>
  <rect width="1449" height="929" fill="white"/>
  <g fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round">
    <path d="M1380 793.5H1415V89.5H573M586 82.5L573 89.5L586 96.5"/>
  </g>
  <g fill="#a9b6c3">
    <path d="M297.5 138H323.5V201.5H336L310.5 227L285 201.5H297.5Z"/>
