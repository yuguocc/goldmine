    <path d="M601 518.5H692.5V506L718 531.5L692.5 557V544.5H601Z"/>
    <path d="M297.5 701H323.5V765.5H336L310.5 791L285 765.5H297.5Z"/>
    <path d="M601 827.5H692.5V815L718 840.5L692.5 866V853.5H601Z"/>
    <path d="M1246.5 638H1272.5V662H1285L1259.5 687L1234 662H1246.5Z"/>
  </g>
