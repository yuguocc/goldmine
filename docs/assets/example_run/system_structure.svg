    <rect x="734.5" y="684.5" width="645" height="217" rx="24"/>
  </g>
  <g fill="white" stroke="#000" stroke-width="3">
    <rect x="65.5" y="49.5" width="506" height="80" rx="8"/>
    <rect x="196.5" y="233.5" width="229" height="48" rx="5"/>
    <rect x="59.5" y="411.5" width="228" height="80" rx="8"/>
    <rect x="336.5" y="411.5" width="229" height="80" rx="8"/>
    <rect x="59.5" y="557.5" width="228" height="80" rx="8"/>
    <rect x="336.5" y="557.5" width="229" height="80" rx="8"/>
    <rect x="725.5" y="411.5" width="156" height="215" rx="16"/>
    <rect x="887.5" y="411.5" width="241" height="217" rx="22"/>
    <rect x="1133.5" y="411.5" width="252" height="218" rx="22"/>
    <rect x="59.5" y="801.5" width="491" height="80" rx="8"/>
